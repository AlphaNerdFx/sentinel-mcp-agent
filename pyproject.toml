[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mcp-agent"
version = "1.0.0"
description = "Deterministic State-Machine ReAct Agent using Model Context Protocol (MCP) with Docker Sandbox Isolation and Observability"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Youssef Larbi", email = "yousseflarbiprofessional@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core Protocol & Multi-Tool Orchestration (Modern 1.x / 4.x Stack)
    "mcp>=2.0.0,<3.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-mcp-adapters>=0.3.0,<0.4.0",
    "fastmcp>=4.0.0,<5.0.0",
    "langchain-openai>=0.3.0",

    # Data Modeling, Telemetry & Invariants
    "pydantic>=2.9.0",

    # Isolation & Sandbox Runtimes
    "docker>=7.1.0",

    # External Providers & Networking
    "duckduckgo-search>=6.3.0",
    "requests>=2.32.0",

    # SQL AST Parsing & Canonicalization
    "sqlglot>=30.0.0,<=30.21.0",

    # Hardware Telemetry (ADR-12)
    "nvidia-ml-py>=12.560.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.32.0",
    "pip-tools>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests with zero network dependencies",
    "e2e: End-to-end integration tests requiring local Ollama and Docker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true